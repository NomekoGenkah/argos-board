[package]
name = "argos-board"
version = "0.1.0"
edition = "2024"
description = "Tablero web local para ver agentes de código CLI trabajando"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
futures-util = "0.3.34"
mime_guess = "2.0.5"
portable-pty = "0.9.0"
regex = "1.13.1"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
toml = "1.1.8"
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
vt100 = "0.16.2"

[dev-dependencies]
tempfile = "3.27.0"
